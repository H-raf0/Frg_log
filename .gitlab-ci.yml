variables:
  # MAVEN_OPTS permet de configurer le comportement de Maven.
  # Ici : 
  #  -maven.repo.local → indique d’utiliser un dépôt local .m2 pour cacher les dépendances
  #  -Slf4jMavenTransferListener=WARN → réduit le bruit des logs
  #  -showDateTime → ajoute le temps dans les logs
  #  -headless=true → évite les problèmes d’UI
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  
  # MAVEN_CLI_OPTS regroupe les options de ligne de commande Maven :
  #  --batch-mode → mode non interactif (CI)
  #  --errors → affiche les erreurs détaillées
  #  --fail-at-end → exécute tous les modules avant d’échouer
  #  --show-version → affiche la version de Maven utilisée
  #  -DinstallAtEnd / -DdeployAtEnd → optimisent l’install et le déploiement
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"

# Cache les dépendances Maven (.m2/repository) entre les builds 
# pour accélérer les exécutions futures
cache:
  paths:
    - .m2/repository

# Définition des étapes du pipeline
stages:
  - build   # compilation
  - test    # exécution des tests
  - package # empaquetage

# Job de compilation
compilation:
  image: maven:3.3.9-jdk-8  # image Docker contenant Maven et JDK8
  stage: build
  script:
    # On compile le projet avec Maven Wrapper
    - ./mvnw $MAVEN_CLI_OPTS compile

# Job de validation (tests unitaires)
validation:
  image: maven:3.3.9-jdk-8
  stage: test
  script:
    # On exécute les tests
    - ./mvnw $MAVEN_CLI_OPTS test

packaging:
  image: maven:3.3.9-jdk-8
  stage: package
  script:
    - ./mvnw $MAVEN_CLI_OPTS package
  artifacts:
    paths:
      - target/*.jar

